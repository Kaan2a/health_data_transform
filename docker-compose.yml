version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./storage/fhir.db
      - JWT_SECRET_KEY=dev_secret_key_12345
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
